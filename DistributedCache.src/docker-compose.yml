services:
  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: distributed-cache-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache-network

volumes:
  redis_data:
    driver: local

networks:
  cache-network:
    driver: bridge
